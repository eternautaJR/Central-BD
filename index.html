<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Painel geral da Blue Door</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F7;--card:#FFFFFF;--ink:#243746;--mute:#6B7780;--line:#DCE3E8;--blue:#0078C0;--blue2:#0091D0;--blue-d:#0068B0;--gray:#989898;--gray-d:#6F7479;--soft:#E3F2FA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:72px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.top{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#F3F8FC 100%);border-bottom:4px solid var(--blue);padding:22px 20px 20px}
.top .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.top img{height:78px;width:auto;display:block}
.top h1{margin:6px 0 0;font-size:clamp(20px,4.2vw,28px);font-weight:800;color:var(--blue-d);letter-spacing:-.01em}
.top p{margin:0;color:var(--mute);font-size:13px}
.top .line{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--blue2),var(--gray));margin:2px 0}
.deco{position:absolute;top:0;bottom:0;width:min(30%,300px);z-index:0;pointer-events:none}
.deco.l{left:0}
.deco.r{right:0;transform:scaleX(-1)}
.deco{-webkit-mask-image:linear-gradient(to right,#000 55%,transparent 100%);mask-image:linear-gradient(to right,#000 55%,transparent 100%)}
.deco svg{width:100%;height:100%;display:block}
@media (max-width:640px){.deco{width:72px}.top img{height:64px}.top p{font-size:12px}}
nav{position:sticky;top:0;z-index:5;background:rgba(238,243,247,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .in{display:flex;gap:8px;padding:10px 20px;overflow-x:auto}
nav a{flex:none;text-decoration:none;font-weight:700;font-size:13px;color:var(--blue-d);background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:99px;white-space:nowrap}
nav a:hover{background:var(--soft)}
main{max-width:1000px;margin:0 auto;padding:8px 20px 56px}
.area{margin-top:28px}
.area>h2{margin:0;padding:14px 18px;border-radius:14px;color:#fff;font-size:clamp(20px,4vw,26px);font-weight:800;letter-spacing:.01em;background:linear-gradient(90deg,var(--blue-d),var(--blue2))}
.area.les>h2{background:linear-gradient(90deg,#5C6268,var(--gray))}
.sec{margin-top:22px}
.sec h3{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--gray-d);text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:center;gap:10px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
a.tile,.copy,.tile.soon{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);font:inherit;text-align:left;width:100%}
a.tile,button.copy{cursor:pointer}
a.tile:hover,button.copy:hover{border-color:var(--blue2);box-shadow:0 2px 10px rgba(0,120,192,.12)}
a.tile:focus-visible,button.copy:focus-visible{outline:2px solid var(--blue-d);outline-offset:2px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--soft)}
.tile.dash .ico{background:linear-gradient(180deg,var(--blue2),var(--blue-d))}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.txt small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--blue-d);background:var(--soft);padding:1px 8px;border-radius:99px;margin-bottom:4px}
.go{flex:none;color:var(--blue);font-weight:800;font-size:18px}
.tile.soon{border-style:dashed;color:var(--mute)}
.tile.soon .ico{background:#ECEEF0}
.tile.soon .badge{color:#5F6A72;background:#ECEEF0}
.copy .val{display:block;font-size:15px;font-weight:700;word-break:break-word}
.copy .lbl{display:block;color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.copy .act{flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--blue);padding:6px 12px;border-radius:99px}
.copy.ok{border-color:#2E9E5B;background:#EAF7EF}
.copy.ok .act{background:#2E9E5B}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#243746;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mute);font-size:13px;padding:0 20px 28px}
</style>
</head>

const $=s=>document.querySelector(s),m=$('#m'),nav=$('#nav'),toast=$('#toast');
let tt;
function say(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1800)}
async function copiar(v){
  try{await navigator.clipboard.writeText(v);return true}catch(e){}
  try{const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}
}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function tile(x){
  const soon=x.tipo==='soon';
  const e=soon?el('div','tile soon'):el('a','tile'+(x.tipo==='dash'?' dash':''));
  if(!soon){e.href=x.url;e.target='_blank';e.rel='noopener'}
  e.innerHTML='<span class="ico"></span><span class="txt"><span class="badge"></span><b></b><small></small></span><span class="go"></span>';
  e.querySelector('.ico').textContent=x.i;
  const bd=e.querySelector('.badge');
  if(x.tipo==='dash')bd.textContent='Dashboard';else if(soon)bd.textContent='Em breve';else bd.remove();
  e.querySelector('b').textContent=x.t;
  e.querySelector('small').textContent=x.d||'';
  e.querySelector('.go').textContent=soon?'':'↗';
  return e;
}
function copyBtn(c){
  const b=el('button','copy','<span class="txt"><span class="lbl"></span><span class="val"></span></span><span class="act">Copiar</span>');
  b.type='button';
  b.querySelector('.lbl').textContent=c.l;b.querySelector('.val').textContent=c.v;
  b.onclick=async()=>{
    const ok=await copiar(c.v);
    if(ok){b.classList.add('ok');b.querySelector('.act').textContent='Copiado ✓';say(c.l+' copiado');setTimeout(()=>{b.classList.remove('ok');b.querySelector('.act').textContent='Copiar'},1800)}
    else say('Não foi possível copiar. Selecione o texto manualmente.');
  };
  return b;
}
AREAS.forEach(a=>{
  const na=el('a',null);na.href='#'+a.id;na.textContent=a.nome;nav.appendChild(na);
  const s=el('section','area '+a.cls);s.id=a.id;s.appendChild(el('h2')).textContent=a.nome;
  a.secoes.forEach(sec=>{
    const w=el('div','sec');w.id=sec.id;w.appendChild(el('h3')).textContent=sec.nome;
    const g=el('div','grid');
    (sec.itens||[]).forEach(x=>g.appendChild(tile(x)));
    (sec.copias||[]).forEach(c=>g.appendChild(copyBtn(c)));
    w.appendChild(g);s.appendChild(w);
  });
  m.appendChild(s);
});
